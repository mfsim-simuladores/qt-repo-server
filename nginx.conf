# qt-repo-server/nginx.conf

server {
    listen 80;
    server_name localhost;

    # O Nginx servirá os arquivos da pasta que criaremos na imagem Docker
    root /usr/share/nginx/html;
    
    include /etc/nginx/mime.types;
    types {
        application/xml xml;
        application/x-7z-compressed 7z;
        text/plain sha1;
    }

    # Configuração da raiz do servidor
    location / {
        index Updates.xml;
        try_files $uri $uri/ =404;
    }

    # Ativa a listagem de arquivos para ajudar o instalador do Qt a escanear as pastas, se necessário
    location /server/ {
        autoindex on;
    }
}