# qt-repo-server/nginx.conf

server {
    listen 8080;
    server_name localhost;

    # Mudamos a raiz diretamente para a pasta server onde seus arquivos reais vivem!
    root /usr/share/nginx/html/server;

    include /etc/nginx/mime.types;
    types {
        application/xml xml;
        application/x-7z-compressed 7z;
        text/plain sha1;
        application/zip zip;
    }

    # SE O INSTALADOR PEDIR O ZIP PESADO, O NGINX REDIRECIONA PARA A CLOUDFLARE R2!
    # Essa regra pega tanto a rota com barra simples quanto com barra dupla (//)
    location ~* com.mfsim.instruments/0.1.0MFSim-Instruments.zip$ {
        return 301 https://pub-54b145e2ed0843a0b91d59b5f1aa14a9.r2.dev/com.mfsim.instruments/0.1.0MFSim-Instruments.zip;
    }

    # Se bater na raiz, busca o Updates.xml direto dentro de /server
    location / {
        index Updates.xml;
        try_files $uri $uri/ =404;
    }
}